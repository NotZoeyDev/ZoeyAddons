name: Publish packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create tags and releases
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changelogs read the commits between release tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release new package versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/vpm.py release

      - name: Build listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force   # tags of the releases the previous step created
          python .github/scripts/vpm.py listing --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
